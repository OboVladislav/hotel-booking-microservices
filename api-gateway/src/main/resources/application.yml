server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-api
              uri: lb://booking-service
              predicates:
                - Path=/api/user,/api/user/**,/api/booking,/api/booking/**,/api/bookings,/api/bookings/**,/user,/user/**,/booking,/booking/**,/bookings,/bookings/**
            - id: hotel-api
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels,/api/hotels/**,/api/rooms,/api/rooms/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
security:
  jwt:
    secret: "my-hotel-booking-jwt-secret-key-2026-secure"
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.springframework.cloud.gateway: INFO
